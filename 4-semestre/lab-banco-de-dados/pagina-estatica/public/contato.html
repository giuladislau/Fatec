<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Node.js</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Seu CSS customizado -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h2 class="logo">Node.js</h2>
            <ul class="nav-links">
                <li><a href="/index.html">Home</a></li>
                <li><a href="/sobre.html">Sobre</a></li>
                <li><a href="/portfolio.html">Portfólio</a></li>
                <li><a href="/blog.html">Blog</a></li>
                <li><a href="/contato.html" class="active">Contato</a></li>
            </ul>
        </div>
    </nav>

    <main class="hero">
        <div class="container">
            <h1 class="title">Entre em Contato</h1>
            <p class="subtitle">Envie sua mensagem e entrarei em contato em breve!</p>

            <div class="form-container">
                <form id="formContato" class="contact-form">
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" required placeholder="Giullia Souza Ladislau">
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="giullialadislau@gmail.com">
                    </div>

                    <div class="form-group">
                        <label for="assunto">Assunto</label>
                        <select id="assunto" name="assunto" required>
                            <option value="">Selecione um assunto</option>
                            <option value="duvida">Dúvida</option>
                            <option value="orcamento">Orçamento</option>
                            <option value="feedback">Feedback</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Digite sua mensagem..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Enviar Mensagem</button>
                </form>

                <div id="mensagem-resposta" class="mensagem-resposta"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 - Meu Primeiro Projeto Node.js</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/contato.js"></script>
</body>
</html>
